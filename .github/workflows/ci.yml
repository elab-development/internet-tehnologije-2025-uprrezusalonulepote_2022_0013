name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend - install, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx jest --ci --testPathPattern=src/__tests__

      - name: Build
        run: npm run build

  backend:
    name: Backend - install, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d salon_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salon_test
      NODE_ENV: test
      JWT_SECRET: ci_dummy_secret_change_later

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Debug paths (backend)
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- package.json (top) ----"
          sed -n '1,120p' package.json
          echo "---- package-lock.json exists? ----"
          ls -la package-lock.json || true
          echo "---- workspace root? (../package.json) ----"
          ls -la ../package.json || true
          sed -n '1,80p' ../package.json || true

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Migrate DB (Drizzle)
        run: npm run db:migrate

      - name: Start backend
        run: |
          npm run dev &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          echo "Backend did not start in time" >&2
          exit 1

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker - build images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: beauty-salon-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: beauty-salon-frontend:ci